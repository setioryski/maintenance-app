<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Offline Maintenance Checklist</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-100">
  <div id="loading" class="text-center p-6">Loading checklist...</div>
  <div id="content" class="max-w-3xl mx-auto p-4 sm:p-6 pb-24 hidden">
    <div class="bg-white shadow-lg rounded-lg p-6">
      <div class="text-center border-b pb-4 mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Maintenance Checklist (Offline)</h1>
        <p class="text-sm text-gray-500" id="current-date"></p>
      </div>

      <div class="bg-blue-50 p-4 rounded-lg mb-6 border border-blue-200">
        <h2 class="font-bold text-lg text-blue-800" id="checklist-title"></h2>
        <p class="text-sm text-gray-700 mt-1">
          Asset: <strong id="asset-name"></strong>
        </p>
        <p class="text-xs text-gray-500" id="asset-location"></p>
      </div>

      <form id="checklist-form" method="POST">
        <div id="task-list" class="space-y-6"></div>
        <div class="mt-8">
          <label class="block text-gray-700 font-bold mb-2" for="note">Notes / Remarks</label>
          <textarea
            id="note"
            name="note"
            rows="4"
            class="w-full border border-gray-300 rounded-lg p-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Add any relevant notes here..."
          ></textarea>
        </div>
      </form>
    </div>
  </div>

  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg p-4">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <a href="/technician/dashboard" class="text-sm font-medium text-gray-600 hover:text-blue-600">&larr; Back to Dashboard</a>
      <button
        type="submit"
        id="submit-btn"
        form="checklist-form"
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-300"
      >
        Submit Checklist
      </button>
    </div>
  </footer>
  
  <div id="modal" class="fixed z-10 inset-0 overflow-y-auto hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div id="modal-icon" class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-blue-100 sm:mx-0 sm:h-10 sm:w-10">
                            </div>
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">
                                </h3>
                            <div class="mt-2">
                                <p class="text-sm text-gray-500" id="modal-body">
                                    </p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button id="modal-confirm-btn" type="button" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 sm:ml-3 sm:w-auto sm:text-sm">
                        OK
                    </button>
                </div>
            </div>
        </div>
    </div>


  <script src="https://unpkg.com/dexie@3.2.5/dist/dexie.js"></script>
  <script src="/js/db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const assignmentId = window.location.hash.substring(1);
      const loadingEl = document.getElementById('loading');
      const contentEl = document.getElementById('content');
      
      if (!assignmentId) {
        loadingEl.textContent = 'Error: No Assignment ID provided.';
        return;
      }

      const data = await getChecklistDataOffline(assignmentId);

      if (!data || !data.assignment || !data.asset || !data.checklist) {
        loadingEl.textContent = 'Error: Could not load checklist data offline. Please go online and sync from the dashboard.';
        return;
      }

      const { assignment, asset, checklist } = data;

      document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('checklist-title').textContent = checklist.title;
      document.getElementById('asset-name').textContent = asset.name;
      document.getElementById('asset-location').textContent = `Location: ${asset.location}`;

      const taskList = document.getElementById('task-list');
      if (checklist.tasks && checklist.tasks.length > 0) {
        checklist.tasks.forEach((task, index) => {
          const taskEl = document.createElement('div');
          taskEl.className = 'border p-4 rounded-lg shadow-sm task-item bg-white';
          taskEl.dataset.taskId = task._id;

          let taskHTML = `
            <input type="hidden" name="taskIds[]" value="${task._id}">
            <label class="block text-gray-800 font-semibold mb-3">
              <span class="text-blue-600 mr-2">${index + 1}.</span>${task.description}
          `;
          if (task.expectedUnit) {
            taskHTML += `<span class="text-xs font-normal text-gray-500">(Unit: ${task.expectedUnit}${task.minRange != null && task.maxRange != null ? `, Range: ${task.minRange}-${task.maxRange}` : ''})</span>`;
          }
          taskHTML += `</label>`;

          if (task.inputType === 'functional') {
            taskHTML += `
              <div class="flex space-x-4">
                <div class="flex-1 p-3 text-center text-green-800 bg-green-100 rounded-lg border-2 border-green-200 cursor-pointer functional-button" data-value="pass">
                  <input type="radio" name="results[${task._id}]" value="pass" required class="sr-only"/> Pass
                </div>
                <div class="flex-1 p-3 text-center text-red-800 bg-red-100 rounded-lg border-2 border-red-200 cursor-pointer functional-button" data-value="fail">
                  <input type="radio" name="results[${task._id}]" value="fail" required class="sr-only"/> Fail
                </div>
              </div>`;
          } else if (task.inputType === 'measurement') {
            taskHTML += `
              <input type="number" step="any" name="results[${task._id}]" placeholder="Enter value..." class="shadow-sm border rounded w-full py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500" required />`;
          }
          taskEl.innerHTML = taskHTML;
          taskList.appendChild(taskEl);
        });
      } else {
        taskList.innerHTML = '<p class="text-center text-gray-600">No tasks available for this checklist.</p>';
      }

      loadingEl.classList.add('hidden');
      contentEl.classList.remove('hidden');

      setupEventListeners(assignmentId, asset.name, checklist.title);
    });

    function setupEventListeners(assignmentId, assetName, checklistTitle) {
      const form = document.getElementById('checklist-form');
      const submitBtn = document.getElementById('submit-btn');
      const modal = document.getElementById('modal');
      const modalConfirmBtn = document.getElementById('modal-confirm-btn');

      modalConfirmBtn.addEventListener('click', () => {
          modal.classList.add('hidden');
      });


      if (form) {
        submitBtn.addEventListener('click', async function(event) {
          event.preventDefault();
          
          let allTasksCompleted = true;
          // Implement validation as in the online page
          const taskElements = document.querySelectorAll('.task-item');
          taskElements.forEach((taskElement) => {
              const functionalRadios = taskElement.querySelectorAll('input[type="radio"]');
              const measurementInput = taskElement.querySelector('input[type="number"]');
              taskElement.style.border = '1px solid #e5e7eb';
              if(measurementInput) measurementInput.classList.remove('border-red-500', 'ring-red-500');
              if (functionalRadios.length > 0 && !Array.from(functionalRadios).some(r => r.checked)) {
                  allTasksCompleted = false;
                  taskElement.style.border = '2px solid red';
              }
              if (measurementInput && measurementInput.value.trim() === '') {
                  allTasksCompleted = false;
                  measurementInput.classList.add('border-red-500', 'ring-red-500');
              }
          });
          if (!allTasksCompleted) {
            showModal('Attention', 'Please complete all checklist items before submitting.', 'error');
            return;
          }
          
          const formData = new FormData(form);
          const submissionData = {
            assignmentId: assignmentId,
            results: {},
            note: formData.get('note'),
            // Add extra data for the offline report view
            timestamp: new Date().toISOString(),
            assetName: assetName,
            checklistTitle: checklistTitle
          };

          formData.forEach((value, key) => {
            if (key.startsWith('results[')) {
              const taskId = key.match(/\[(.*?)\]/)[1];
              submissionData.results[taskId] = value;
            }
          });

          await addPendingSubmission(submissionData);
          showModal('Submission Saved', 'You are offline. Your submission has been saved and will be synced automatically when you are back online.', 'success', () => {
             window.location.href = '/technician/dashboard';
          });
        });
      }
      
    function showModal(title, body, type = 'info', onConfirm) {
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalIcon = document.getElementById('modal-icon');
        const modalConfirmBtn = document.getElementById('modal-confirm-btn');

        modalTitle.textContent = title;
        modalBody.textContent = body;

        let iconHtml = '';
        if (type === 'error') {
            iconHtml = '<svg class="h-6 w-6 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>';
        } else { // success or info
            iconHtml = '<svg class="h-6 w-6 text-green-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>';
        }
        modalIcon.innerHTML = iconHtml;
        
        const newConfirmBtn = modalConfirmBtn.cloneNode(true);
        modalConfirmBtn.parentNode.replaceChild(newConfirmBtn, modalConfirmBtn);

        if (onConfirm) {
            newConfirmBtn.addEventListener('click', onConfirm);
        } else {
            newConfirmBtn.addEventListener('click', () => modal.classList.add('hidden'));
        }


        modal.classList.remove('hidden');
    }


      document.querySelectorAll('.functional-button').forEach(button => {
        button.addEventListener('click', () => {
          const radio = button.querySelector('input[type="radio"]');
          radio.checked = true;
          const taskItem = button.closest('.task-item');
          if (taskItem) {
            const allButtons = taskItem.querySelectorAll('.functional-button');
            allButtons.forEach(btn => {
              const btnRadio = btn.querySelector('input[type="radio"]');
              if (btnRadio.checked) {
                if (btn.dataset.value === 'pass') {
                  btn.classList.remove('bg-green-100', 'text-green-800');
                  btn.classList.add('bg-green-600', 'text-white');
                } else {
                  btn.classList.remove('bg-red-100', 'text-red-800');
                  btn.classList.add('bg-red-600', 'text-white');
                }
              } else {
                if (btn.dataset.value === 'pass') {
                  btn.classList.add('bg-green-100', 'text-green-800');
                  btn.classList.remove('bg-green-600', 'text-white');
                } else {
                  btn.classList.add('bg-red-100', 'text-red-800');
                  btn.classList.remove('bg-red-600', 'text-white');
                }
              }
            });
          }
        });
      });
    }
  </script>
</body>
</html>
