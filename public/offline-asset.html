<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Offline Asset Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

  <header class="bg-white shadow-sm sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <h1 class="text-xl font-bold text-gray-800">Asset Detail (Offline)</h1>
        <a href="/technician/dashboard" class="text-sm font-medium text-gray-600 hover:text-blue-600">Back to Dashboard</a>
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto p-4">
    <div id="loading" class="text-center p-6">Loading asset data...</div>
    <div id="content" class="bg-white rounded-lg shadow p-6 hidden">
      <h2 id="asset-name" class="text-2xl font-bold text-gray-800 mb-2"></h2>
      <p id="asset-location" class="text-sm text-gray-500 mb-4"></p>
      <p id="asset-description" class="text-gray-700 mb-6"></p>

      <h3 class="text-xl font-bold text-gray-800 mb-4">Assigned Checklists</h3>
      <div id="assignments-list" class="space-y-4">
        </div>
    </div>
  </div>

  <script src="https://unpkg.com/dexie@3.2.5/dist/dexie.js"></script>
  <script src="/js/db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const assetId = window.location.hash.substring(1);
      const loadingEl = document.getElementById('loading');
      const contentEl = document.getElementById('content');

      if (!assetId) {
        loadingEl.textContent = 'Error: No Asset ID provided.';
        return;
      }

      const { asset, assignments } = await getAssetAndAssignmentsOffline(assetId);

      if (!asset) {
        loadingEl.textContent = 'Error: Asset not found in offline data. Please connect to the internet and sync from the dashboard.';
        return;
      }

      // Populate asset details
      document.getElementById('asset-name').textContent = asset.name;
      document.getElementById('asset-location').textContent = asset.location || 'Location not available';
      document.getElementById('asset-description').textContent = asset.description;

      // Populate assignments list
      const assignmentsList = document.getElementById('assignments-list');
      if (assignments.length > 0) {
        assignmentsList.innerHTML = ''; // Clear previous entries
        assignments.forEach(assignment => {
          const checklist = assignment.checklist;
          const assignmentEl = document.createElement('div');
          assignmentEl.className = 'flex justify-between items-center p-4 border rounded-md hover:bg-gray-50';
          // CORRECTED: Link to the new offline checklist page
          assignmentEl.innerHTML = `
            <p class="font-semibold text-gray-800">${checklist ? checklist.title : 'Checklist not found offline'}</p>
            <a href="/offline-checklist.html#${assignment._id}" class="text-center text-sm px-4 py-2 bg-blue-100 hover:bg-blue-200 text-blue-800 font-semibold rounded-lg transition">
              Start Checklist
            </a>
          `;
          assignmentsList.appendChild(assignmentEl);
        });
      } else {
        assignmentsList.innerHTML = '<p class="text-gray-500">No checklists assigned to this asset.</p>';
      }

      loadingEl.classList.add('hidden');
      contentEl.classList.remove('hidden');
    });
  </script>
</body>
</html>
