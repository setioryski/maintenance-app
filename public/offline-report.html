<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Sync Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

<header class="bg-white shadow-sm sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
            <h1 class="text-xl font-bold text-gray-800">Reports Pending Sync</h1>
            <a href="/technician/dashboard" class="text-sm font-medium text-gray-600 hover:text-blue-600">&larr; Back to Dashboard</a>
        </div>
    </div>
</header>

<div class="container mx-auto p-4 sm:p-6">
    <div id="loading" class="text-center p-6 text-gray-600">Loading pending reports...</div>
    <div id="report-list" class="hidden overflow-x-auto bg-white shadow-lg rounded-lg">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Asset / Checklist</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Saved At</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                </tr>
            </thead>
            <tbody id="report-tbody" class="bg-white divide-y divide-gray-200">
                </tbody>
        </table>
    </div>
</div>

<script src="https://unpkg.com/dexie@3.2.5/dist/dexie.js"></script>
<script src="/js/db.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const loadingEl = document.getElementById('loading');
        const reportListEl = document.getElementById('report-list');
        const tbody = document.getElementById('report-tbody');

        // Fetch PENDING submissions, not completed reports
        const pendingSubmissions = await getPendingSubmissions();

        if (pendingSubmissions.length === 0) {
            loadingEl.innerHTML = `
                <div class="text-center py-12">
                    <h3 class="text-lg font-medium text-gray-700">No Pending Reports</h3>
                    <p class="text-gray-500 mt-1">All your offline reports have been synced.</p>
                </div>
            `;
            return;
        }

        tbody.innerHTML = ''; // Clear existing content

        pendingSubmissions.forEach(report => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-50';

            const statusHTML = '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">Pending Sync</span>';

            tr.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm font-medium text-gray-900">${report.assetName || 'N/A'}</div>
                    <div class="text-sm text-gray-500">${report.checklistTitle || 'N/A'}</div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                    ${new Date(report.timestamp).toLocaleString()}
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    ${statusHTML}
                </td>
            `;
            tbody.appendChild(tr);
        });

        loadingEl.classList.add('hidden');
        reportListEl.classList.remove('hidden');
    });
</script>
</body>
</html>
